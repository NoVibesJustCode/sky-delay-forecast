<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyDelay — Live Airport Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<!-- The map canvas -->
<div id="map"></div>

<!-- Title overlay -->
<div class="map-overlay" id="mapOverlay">
    <div class="overlay-brand">
        <span class="overlay-logo">✈</span>
        <div>
            <h1>SkyDelay <span class="overlay-tag">Live Map</span></h1>
            <p>Real-time delay snapshot · Spanish airport network</p>
        </div>
    </div>
</div>

<!-- Floating legend — vertical gradient bar -->
<div class="map-legend" id="mapLegend">
    <div class="legend-title">Severity</div>
    <div class="legend-gradient-wrap">
        <div class="legend-gradient-bar"></div>
        <div class="legend-gradient-labels">
            <span>None</span>
            <span>Low</span>
            <span>Moderate</span>
            <span>Severe</span>
        </div>
    </div>
</div>

<!-- Loading splash (animated out by anime.js) -->
<div id="loader">
    <div class="loader-plane">✈</div>
    <div class="loader-text">Plotting airports…</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script src="app.js"></script>
</body>
</html>
